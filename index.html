<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX - Basic Website Page</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <!-- Navbar -->
    <nav>
        <div class="image-container">
            <img src="./assets/logo.png" alt="">
            <h1>ScaleX</h1>
        </div>


        <div class="menu-buttons">
            <a href="#">Home</a>
            <a href="#">About Us</a>
            <a href="#">Blogs</a>
            <a href="#">Contact Us</a>
        </div>
        <button>Get Started</button>
    </nav>


    <section>
        <!-- Main Heading -->
        <div id="main-heading">
            <h1>Insignts & Blogs</h1>
        </div>

        <div id="section-1">
            <div id="tech-buttons">
                <button>All</button>
                <button>Tech</button>
                <button>SaSS</button>
                <button>Marketing</button>
            </div>

            <div id="tech-img-containers">

                <!-- Container 1 -->
                <div id="container-1" class="container">
                    <div class="container-img">
                        <img src="./assets/glass_with_olives.png" alt="">
                    </div>
                    <div class="container-tech">
                        <button>Tech</button>
                    </div>
                    <div class="container-info">
                        <h1>The Ultimate Guide To SaaS Marketing</h1>
                    </div>
                    <div class="container-date">
                        <p>May 23, 2025</p>
                    </div>
                </div>

                <!-- Container 2 -->
                <div id="container-2" class="container">
                    <div class="container-img">
                        <img src="./assets/Chair.png" alt="">
                    </div>
                    <div class="container-tech">
                        <button>SaaS</button>
                    </div>
                    <div class="container-info">
                        <h1>5 Key Trends In SaaS Growth For 2025</h1>
                    </div>
                    <div class="container-date">
                        <p>May 23, 2025</p>
                    </div>
                </div>

                <!-- Container 3 -->
                <div id="container-3" class="container">
                    <div class="container-img">
                        <img src="./assets/cat.png" alt="">
                    </div>
                    <div class="container-tech">
                        <button>Marketing</button>
                    </div>
                    <div class="container-info">
                        <h1>How Data-Driven Strategies Are Important</h1>
                    </div>
                    <div class="container-date">
                        <p>May 23, 2025</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

</body>

</html>
